名称：IPTV-早-更新: IPTV‑早‑Update
在：:
  时间表：:
    - cron: '0 01 * * *'
      时区: "Asia/Shanghai": "Asia/Shanghai"
  workflow_dispatch::

并发：:
  组：晚班: evening-job
  取消进行中: true: true

职位：:
  更新：:
    运行环境: ubuntu-latest: ubuntu-latest
    步骤：:
      - 名称：结账码name: Checkout code
        使用：actions/checkout@v4: actions/checkout@v4
        使用：:
          fetch-depth: 0: 0

      - 名称：设置 Pythonname: Set up Python
        使用：actions/setup-python@v5: actions/setup-python@v5
        使用：:
          python-version: "3.9": "3.9"

      - name: 安装依赖项name: Install dependencies
        运行：|: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      - name: 创建输出目录name: Create output directory
        运行：mkdir -p output: mkdir -p output

      - 名称：运行脚本name: Run script
        运行：|: |
          python all-z-j-new.py --jsmpeg jsmpeg.csv --txiptv txiptv.csv --zhgxtv zhgxtv.csv --output output/itvlist

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action‑Evening"
          git fetch origin
          git add output/
          if git diff --staged --quiet; then
            echo "✅ 节目列表无更新，跳过提交"
          else
            git commit -m "Evening: Update IPTV channel lists"
            git push --force origin main
            echo "✅ 文件已更新并推送"
          fi
