名称：自动更新节目列表: 自动更新节目列表

在：:
  # 每天早上4点自动运行# 每天下午5点自动运行
  时间表：:
    - cron: '0 20 * * *'
    - cron: '0 9 * * *'
  # 手动触发# 手动触发
  工作流_调度:

职位：:
  更新：:
    运行环境: ubuntu-latestbuntu-latest: ubuntu-latest

    步骤：:
      - 名称：结账代码name: Checkout code
        使用：actions/checkout@v3: actions/checkout@v3

      - 名称：设置 Pythonname: 设置 Python
        使用：actions/setup-python@v4: actions/setup-python@v4
        使用：:
          python-version: 3.9.9: 3.9

      - 名称: 安装依赖项名称装依赖项name: 安装依赖项
        运行：|: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      - 名称：创建输出目录name: 创建输出目录
        运行：mkdir -p output: mkdir -p output

      - 名称：运行脚本name: 运行脚本
        运行：|: |
          python all-z-j-new.py --jsmpeg jsmpeg.csv --txiptv txiptv.csv --zhgxtv zhgxtv.csv --output output/itvlist

      - 名称：提交并推送更改name: 提交并推送更改
        运行：|: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          如果 git diff --staged --quiet; 那么
            echo "没有需要提交的更改。"
          否则
            git commit -m "更新 IPTV 频道列表"
            git push --force-with-lease origin main
          fi
