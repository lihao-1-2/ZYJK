name: 自动更新酒店节目列表
on:
  # 北京时间 早5点、晚17点，使用UTC cron，不再使用timezone字段
  schedule:
    # 北京时间 05:00  = UTC 前一天 21:00
    - cron: '0 21 * * *'
    # 北京时间 17:00 = UTC 当天 09:00
    - cron: '0 9 * * *'
  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp
      - name: Create output directory
        run: mkdir -p output
      - name: Run script
        run: |
          python all-z-j-new.py --jsmpeg jsmpeg.csv --txiptv txiptv.csv --zhgxtv zhgxtv.csv --output output/itvlist
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTV channel lists"
            git push --force-with-lease origin main
          fi
