name: ZYJK Auto Update
on:
  schedule:
    # 北京时间 07:00
    - cron: '0 7 * * *'
      timezone: "Asia/Shanghai"
    # 北京时间 19:00（下午7点）
    - cron: '0 19 * * *'
      timezone: "Asia/Shanghai"
  # 手动触发按钮，方便测试
  workflow_dispatch:

# 授予读写权限，脚本提交更新文件回仓库必备
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # 拉取代码，升级到v4，消除Node20警告
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置Python，升级到v5，消除Node20警告
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 修改成你项目实际使用的Python版本，例如3.10

